<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Roast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #023047;
            --secondary-color: #fb8500;
            --accent-color: #8ecae6;
            --text-color: #333333;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            background-color: var(--light-bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--primary-color);
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--secondary-color) !important;
        }

        .nav-link {
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--secondary-color) !important;
        }

        .btn-custom {
            background-color: var(--secondary-color);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #ffb703;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, .1);
        }

        .header-section {
            background-color: var(--primary-color);
            color: white;
            padding: 4rem 0;
            display: flex;
        }

        .header-image {
            background: url('/static/images/oka.jpg') no-repeat center center;
            background-size: cover;
            height: 400px;
            border-radius: 0.5rem;
            transition: transform 0.3s ease;
        }

        .header-image:hover {
            transform: scale(1.05);
        }

        .header-text h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .header-text p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        #resume-roast,
        #roastResult {
            padding: 30px;
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        #resume-roast:hover,
        #roastResult:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        #resume-roast h2,
        #roastResult h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .btn-primary {
            background-color: var(--secondary-color);
            border: none;
            padding: 12px 24px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #ff8f8f;
        }

        .roast-card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
        }

        .roast-card h3 {
            color: var(--primary-color);
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .roast-card p {
            margin-bottom: 10px;
        }

        .recommendations {
            background-color: #e9ecef;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }

        .recommendations h4 {
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            padding-top: 50px;
            flex-shrink: 0;
        }

        footer a {
            color: var(--accent-color);
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--secondary-color);
            text-decoration: none;
        }

        footer h6 {
            font-weight: 600;
            margin-bottom: 20px;
        }

        .social-icons a {
            font-size: 1.5rem;
            margin-right: 15px;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--secondary-color);
            transform: translateY(-3px);
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>

<body>
    <!-- Header and navigation remain unchanged -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="/">CV.ai</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                        <li class="nav-item"><a href="{{ url_for('upload_resume_page') }}" class="nav-link">Resume Insights</a></li>
                        <li class="nav-item"><a href="#" class="nav-link">Resume Optimizer</a></li>
                        <li class="nav-item">  <a href="{{ url_for('match_jd') }}" class="nav-link">Resume-JD Matcher</a></li>
                        <!-- <li class="nav-item"><a href="#" class="nav-link">Resume Roast</a></li> -->
                        <li class="nav-item"><a href="#" class="nav-link">Pricing</a></li>
                    </ul>
                    <div class="d-flex">
                        <!-- <a href="#" class="btn btn-outline-light me-2">Login</a> -->
                        <a href="/roast" class="btn btn-custom">Resume Roast</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <section class="header-section">
        <div class="container">
            <h1>Let's Roast Your Resume!</h1>
            <p>Upload your resume and get a hilarious critique.</p>
        </div>
    </section>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-6 mb-4 mb-md-0">
                <div id="resume-roast">
                    <h2>Upload Your Resume</h2>
                    <form id="uploadForm" enctype="multipart/form-data" action="/upload" method="POST">
                        <input type="file" id="resume" name="resume" accept=".pdf, .docx, .txt" />
                        <button type="submit" class="btn btn-primary mt-3">Upload Resume</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <form action="/get_roast_page" method="POST">
                    <button type="submit" id="getFeedbackBtn" class="btn btn-primary mt-3" style="display: none;">Roast my resume</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <h6>Follow Us</h6>
            <div class="social-icons">
                <a href="#" target="_blank" class="text-white"><i class="fab fa-facebook-f"></i></a>
                <a href="#" target="_blank" class="text-white"><i class="fab fa-twitter"></i></a>
                <a href="#" target="_blank" class="text-white"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <p class="mt-3">&copy; 2024 CV.ai. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.getElementById('uploadForm').onsubmit = function(event) {
        event.preventDefault();
        var formData = new FormData(this);
  
        fetch('/upload', {
          method: 'POST',
          body: formData
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            var fileType = data.fileType; // This needs to be set by your server-side response
            var fileURL = data.fileURL; // This needs to be set by your server-side response
  
            // Show feedback button
            document.getElementById('getFeedbackBtn').style.display = 'block';
  
            // Handle different file types
            if (fileType === 'pdf') {
              document.getElementById('pdfViewer').src = fileURL;
              document.getElementById('pdfViewer').style.display = 'block';
            } else if (fileType === 'txt') {
              fetch(fileURL)
                .then(response => response.text())
                .then(text => {
                  document.getElementById('txtViewer').textContent = text;
                  document.getElementById('txtViewer').style.display = 'block';
                });
            } else if (fileType === 'docx') {
              document.getElementById('docxViewer').href = fileURL;
              document.getElementById('docxViewer').style.display = 'block';
            }
          }
        });
      };
    </script>
</body>

</html>
