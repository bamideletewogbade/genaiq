<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Roast of Your Resume</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; }
        h1 { color: #FE8C00; }
        .step { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .step-header { font-weight: bold; color: #FE8C00; margin-bottom: 5px; }
        .step-description { font-size: 1rem; color: #333; }
        .intro-text { font-size: 1.2rem; color: #555; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>The Roast of Your Resume</h1>
    <p class="intro-text">{{introduction}}</p>

    {{#each steps}}
        <div class="step">
            <div class="step-header">{{header}}</div>
            <div class="step-description">{{description}}</div>
        </div>
    {{/each}}
</body>
</html>
