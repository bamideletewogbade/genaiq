<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detailed feedback on your uploaded document.">
    <title>Feedback - Document Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Feedback</h1>
    </header>

    <main>
        <section aria-labelledby="overall-feedback">
            <h2 id="overall-feedback">Overall Feedback</h2>
            <p>{{ analysis_result }}</p>
        </section>

        <section aria-labelledby="content-feedback">
            <h2 id="content-feedback">Content</h2>
            <p>{{ analysis_result.content }}</p>
        </section>

        <section aria-labelledby="structure-feedback">
            <h2 id="structure-feedback">Structure</h2>
            <p>{{ analysis_result.structure }}</p>
        </section>

        <section aria-labelledby="formatting-feedback">
            <h2 id="formatting-feedback">Formatting</h2>
            <p>{{ analysis_result.formatting }}</p>
        </section>

        <section aria-labelledby="language-feedback">
            <h2 id="language-feedback">Language</h2>
            <p>{{ analysis_result.language }}</p>
        </section>

        <a href="{{ pdf_url }}" download>Download Feedback as PDF</a>
    </main>

    <footer>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('upload_resume_page') }}">Upload Another File</a>
        </nav>
    </footer>
</body>
</html>
